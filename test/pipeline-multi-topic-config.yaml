apiVersion: v1
kind: ConfigMap
metadata:
  name: test-multi-topic-consumer-config
  namespace: default
data:
  consumer.properties: |
    bootstrap.servers=kafka.kafka.svc.cluster.local:9092
    security.protocol=PLAINTEXT
    client.dns.lookup=use_all_dns_ips
    session.timeout.ms=45000
    retries=0
    group.id=test-multi-topic-group
    # This group is created by the test run, so it has no committed offset. Without earliest, the
    # default of latest would drop anything produced before the consumer finishes joining.
    auto.offset.reset=earliest
  user.configuration: |
    topicNames:
      - test-raw
      - test-raw-2
    schemaType: raw
