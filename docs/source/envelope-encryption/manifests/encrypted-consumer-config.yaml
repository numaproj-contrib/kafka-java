---
apiVersion: v1
kind: ConfigMap
metadata:
  name: encrypted-consumer-config
data:
  consumer.properties: |
    # Required connection configs for Kafka consumer and admin
    bootstrap.servers=[placeholder]
    security.protocol=[placeholder]
    sasl.jaas.config=[placeholder]
    sasl.mechanism=[placeholder]
    # Required for correctness in Apache Kafka clients prior to 2.6
    client.dns.lookup=use_all_dns_ips
    # Best practice for higher availability in Apache Kafka clients prior to 3.0
    session.timeout.ms=45000
    # Other configurations
    retries=0
    # group.id is required for consumer clients
    group.id=group1

    # Enable payload envelope decryption: set the KMS key ARN (its presence turns decryption on).
    payload.envelope.encryption.provider.aws-kms.key.arn=arn:aws:kms:us-east-1:123456789012:key/[placeholder]
    # Optional: plaintext-DEK cache TTL in ms (default 3600000 = 1h)
    # payload.envelope.encryption.dek.cache.ttl.ms=3600000

    # Optional: assume an IAM role before connecting to KMS
    # (the role must carry kms:Decrypt on the key above)
    # assumeRoleArn=arn:aws:iam::123456789012:role/my-consumer-role
  user.configuration: |
    topicName: [placeholder]
    # raw: the decrypted bytes are forwarded as they are, with no deserialization step. Decryption
    # is configured the same way for any other schemaType.
    schemaType: raw
    # Optional: fail (default) crashes the vertex on a record that fails to be read; skip drops
    # and counts it instead. See docs/source/on-error.md.
    # onError: fail
