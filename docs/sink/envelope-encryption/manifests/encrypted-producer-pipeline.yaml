apiVersion: numaflow.numaproj.io/v1alpha1
kind: Pipeline
metadata:
  name: encrypted-producer-pipeline
spec:
  vertices:
    - name: in
      scale:
        min: 1
        max: 1
      source:
        generator:
          rpu: 1
          duration: 1s
          keyCount: 1
          value: 1
    - name: sink
      volumes:
        - name: kafka-config-volume
          configMap:
            name: encrypted-producer-config
            items:
              - key: user.configuration
                path: user.configuration.yaml
              - key: producer.properties
                path: producer.properties
      scale:
        min: 1
        max: 1
      sink:
        udsink:
          container:
            image: quay.io/numaio/numaflow-java/kafka-java:v0.5.6
            args: [ "--config=/conf/user.configuration.yaml", "--producer.properties.path=/conf/producer.properties" ]
            imagePullPolicy: Always

            # AWS credentials for KMS access: recommended to use a Kubernetes Secret.
            # The identity must have kms:GenerateDataKey on the configured key.
            # See docs/credentials-management/protecting-credentials.md.
            envFrom:
              - secretRef:
                  name: aws-creds

            volumeMounts:
              - name: kafka-config-volume
                mountPath: /conf
  edges:
    - from: in
      to: sink
