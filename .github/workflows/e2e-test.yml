name: E2E Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Build image
        run: mvn package -DskipTests

      - name: Install k3d
        run: curl -sfL https://raw.githubusercontent.com/rancher/k3d/main/install.sh | bash

      - name: Create k3d cluster
        run: k3d cluster create test-cluster --agents 1

      - name: Load image into k3d
        # Retag the freshly built image to a stable local name and import it directly
        # into the cluster — avoids needing to push to (or pull from) a registry.
        run: |
          IMAGE_TAG=$(mvn help:evaluate -Dexpression=image.tag -q -DforceStdout | tr -d '\n')
          docker tag quay.io/numaio/numaflow-java/kafka-java:$IMAGE_TAG kafka-java:e2e
          k3d image import kafka-java:e2e -c test-cluster

      - name: Install Numaflow
        run: |
          kubectl create namespace numaflow-system
          kubectl apply -n numaflow-system -f https://github.com/numaproj/numaflow/releases/download/v1.7.5/install.yaml
          kubectl apply -f https://github.com/numaproj/numaflow/releases/download/v1.7.5/validating-webhook-install.yaml
          kubectl wait --for=condition=Available deployment --all -n numaflow-system --timeout=120s

      - name: Create InterStepBufferService
        run: |
          kubectl apply -f - <<EOF
          apiVersion: numaflow.numaproj.io/v1alpha1
          kind: InterStepBufferService
          metadata:
            name: default
            namespace: default
          spec:
            jetstream:
              version: latest
          EOF
          kubectl wait --for=jsonpath='{.status.phase}'=Running interstepbufferservice/default -n default --timeout=120s
          for i in $(seq 1 60); do
            COUNT=$(kubectl get pod -l numaflow.numaproj.io/isbsvc-name=default -n default --no-headers 2>/dev/null | wc -l)
            if [ "$COUNT" -gt "0" ]; then
              echo "ISB pods found, waiting for Ready..."
              break
            fi
            echo "Waiting for ISB pods to be scheduled... attempt $i/60"
            sleep 2
          done
          kubectl wait --for=condition=Ready pod -l numaflow.numaproj.io/isbsvc-name=default -n default --timeout=120s

      - name: Deploy Kafka
        run: |
          kubectl create namespace kafka
          kubectl apply -f test/kafka.yaml
          kubectl rollout status deployment/kafka -n kafka --timeout=120s

      - name: Create test topic
        run: |
          KAFKA_POD=$(kubectl get pod -n kafka -l app=kafka -o jsonpath='{.items[0].metadata.name}')
          kubectl exec -n kafka $KAFKA_POD -- /opt/kafka/bin/kafka-topics.sh \
            --create --topic test-raw \
            --bootstrap-server localhost:9092 \
            --partitions 1 --replication-factor 1

      - name: Deploy pipeline
        run: |
          kubectl apply -f test/pipeline.yaml
          kubectl apply -f test/pipeline-config.yaml
          kubectl wait --for=condition=Ready pod \
            -l numaflow.numaproj.io/pipeline-name=test-kafka-pipeline \
            -n default --timeout=120s

      - name: Produce test messages
        run: |
          KAFKA_POD=$(kubectl get pod -n kafka -l app=kafka -o jsonpath='{.items[0].metadata.name}')
          kubectl exec -n kafka $KAFKA_POD -- bash -c \
            'echo -e "hello numaflow 1\nhello numaflow 2\nhello numaflow 3" | /opt/kafka/bin/kafka-console-producer.sh --topic test-raw --bootstrap-server localhost:9092'

      - name: Assert messages received by sink
        run: |
          SINK_POD=$(kubectl get pod -n default -l numaflow.numaproj.io/vertex-name=sink -o jsonpath='{.items[0].metadata.name}')
          for i in $(seq 1 30); do
            LOGS=$(kubectl logs $SINK_POD -n default --all-containers=true 2>/dev/null)
            if echo "$LOGS" | grep -q "hello numaflow 1" && \
               echo "$LOGS" | grep -q "hello numaflow 2" && \
               echo "$LOGS" | grep -q "hello numaflow 3"; then
              echo "All 3 messages received by sink"
              exit 0
            fi
            echo "Waiting for messages... attempt $i/30"
            sleep 5
          done
          echo "ERROR: Messages not received in sink after 150s"
          kubectl logs $SINK_POD -n default --all-containers=true | tail -50
          exit 1

      # ---------------------------------------------------------------------------
      # Multi-topic scenario, reusing the same cluster, namespace, Numaflow
      # controller/ISB and Kafka broker as the single-topic test above. It runs as
      # an independent pipeline (own name, consumer group and topics), so it does
      # not interfere with the single-topic pipeline already deployed.
      # ---------------------------------------------------------------------------
      - name: Create the three multi-topic test topics
        run: |
          KAFKA_POD=$(kubectl get pod -n kafka -l app=kafka -o jsonpath='{.items[0].metadata.name}')
          # multi-topic-a has 2 partitions to also exercise multi-partition consumption
          kubectl exec -n kafka $KAFKA_POD -- /opt/kafka/bin/kafka-topics.sh \
            --create --topic multi-topic-a --bootstrap-server localhost:9092 --partitions 2 --replication-factor 1
          kubectl exec -n kafka $KAFKA_POD -- /opt/kafka/bin/kafka-topics.sh \
            --create --topic multi-topic-b --bootstrap-server localhost:9092 --partitions 1 --replication-factor 1
          kubectl exec -n kafka $KAFKA_POD -- /opt/kafka/bin/kafka-topics.sh \
            --create --topic multi-topic-c --bootstrap-server localhost:9092 --partitions 1 --replication-factor 1

      - name: Deploy multi-topic pipeline
        run: |
          # Use the locally built image tag, not the quay.io remote
          IMAGE_TAG=$(mvn help:evaluate -Dexpression=image.tag -q -DforceStdout | tr -d '\n')
          sed "s|quay.io/numaio/numaflow-java/kafka-java:.*|quay.io/numaio/numaflow-java/kafka-java:$IMAGE_TAG|g" test/multi-topic/pipeline.yaml \
            | kubectl apply -f -
          kubectl apply -f test/multi-topic/pipeline-config.yaml
          kubectl wait --for=condition=Ready pod \
            -l numaflow.numaproj.io/pipeline-name=test-multi-topic-pipeline \
            -n default --timeout=120s

      - name: Produce a distinct message to each multi-topic topic
        run: |
          KAFKA_POD=$(kubectl get pod -n kafka -l app=kafka -o jsonpath='{.items[0].metadata.name}')
          for T in multi-topic-a multi-topic-b multi-topic-c; do
            kubectl exec -n kafka $KAFKA_POD -- bash -c \
              "echo 'hello-from-${T}' | /opt/kafka/bin/kafka-console-producer.sh --topic ${T} --bootstrap-server localhost:9092"
          done

      - name: Assert every topic's record reaches the sink with the correct topic header
        run: |
          # Both pipelines have a vertex named "sink", so filter by pipeline-name too.
          SINK_POD=$(kubectl get pod -n default \
            -l numaflow.numaproj.io/pipeline-name=test-multi-topic-pipeline,numaflow.numaproj.io/vertex-name=sink \
            -o jsonpath='{.items[0].metadata.name}')
          for i in $(seq 1 30); do
            LOGS=$(kubectl logs $SINK_POD -n default --all-containers=true 2>/dev/null)
            OK=true
            for T in multi-topic-a multi-topic-b multi-topic-c; do
              # A single sink log line must carry both the topic's payload and its source-topic
              # header (X-NF-Kafka-TopicName), proving the record was merged in from that topic and
              # tagged correctly.
              if ! echo "$LOGS" | grep "hello-from-${T}" | grep -q "X-NF-Kafka-TopicName: ${T}"; then
                OK=false
              fi
            done
            if [ "$OK" = "true" ]; then
              echo "All three topics' records received with correct X-NF-Kafka-TopicName headers"
              exit 0
            fi
            echo "Waiting for all topics' messages... attempt $i/30"
            sleep 5
          done
          echo "ERROR: not all topics' messages (with correct headers) received in sink after 150s"
          kubectl logs $SINK_POD -n default --all-containers=true | tail -80
          exit 1
